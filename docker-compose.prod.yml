services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./info/football:/app/data
    environment:
      - DATA_DIR=/app/data
    command: gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - backend
